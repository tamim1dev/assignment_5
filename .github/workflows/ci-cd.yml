name: Node.js CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # 1. Quality Control Job (Lint & Test)
  test-and-lint:
    runs-on: ostad-runner

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting and rules
        run: npm run lint

      - name: Run application test suite
        run: npm run test

  # 2. Deployment Job (Runs only if Lint & Test pass successfully)
  deploy:
    needs: test-and-lint
    runs-on: ostad-runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Execute production deployment
        run: |
          echo "============================================="
          echo "🚀 Production build verified."
          echo "📦 Syncing build artifacts to production servers..."
          echo "🎉 CI/CD done successfully!"
          echo "============================================="
